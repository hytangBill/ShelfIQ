          \ 304.8\"\n    products = []\n    for chunk in kb_profiles_out:\n      \
          \  raw = chunk.get(\"content\") or chunk.get(\"text\") or \"\"\n       \
          \ if not raw:\n            continue\n        item = {}\n        for line\
          \ in raw.split(\"\\n\"):\n            if \":\" in line:\n              \
          \  k, v = line.split(\":\", 1)\n                item[k.strip().lower().replace(\"\
          \ \", \"_\")] = v.strip()\n        if item.get(\"sku\"):\n            products.append(item)\n\
          \n    # 檢索抓不到東西時的保底資料，取自你的 fast_fashion CSV 真實幾筆\n    if not products:\n\
          \        products = [\n            {\"sku\": \"31526\", \"product_name\"\
          : \"ZIP THROUGH HOODIE BLACK\", \"list_price\": 24.99, \"unit_cost\": 11.49,\
          \ \"units_on_hand\": 2971.0, \"weekly_velocity\": 304.8, \"weeks_of_cover\"\
