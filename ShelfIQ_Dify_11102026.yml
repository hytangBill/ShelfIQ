    - data:
        code: "import json, math\n\ndef main(specific_product: list) -> dict:\n  \
          \  weeks_left = 6  # 目前沒有額外資訊可以判斷剩餘銷售週期，先用固定值；之後如果想接使用者實際講的週數，可以再加一個輸入變數\n\
          \n    results = []\n    for p in specific_product:\n        sku = str(p.get(\"\
          sku\", \"\"))\n        name = p.get(\"product_name\", \"SKU \" + sku)\n\
          \        category = p.get(\"category\", \"unknown\")\n        price = float(p.get(\"\
          list_price\", 25.0))\n        cost = float(p.get(\"unit_cost\", 10.0))\n\
          \        uoh = float(p.get(\"units_on_hand\", 1000))\n        vel = max(float(p.get(\"\
          weekly_velocity\", 150.0)), 0.1)\n        cover = float(p.get(\"weeks_of_cover\"\
          , round(uoh / vel, 1)))\n        margin = float(p.get(\"margin_pct\", round((price\
          \ - cost) / price * 100, 1)))\n        trend = p.get(\"trend\", \"stable\"\
          )\n\n        pr = round(cover / weeks_left, 2)\n        cu = max(price -\
          \ cost, 0.01)\n        co = max(cost * 0.7, 0.01)\n        cr = round(cu\
          \ / (cu + co), 3)\n        z = (cr - 0.5) * 2.5\n        optimal_q = round(vel\
          \ * weeks_left + z * (math.sqrt(vel * weeks_left) * 0.8))\n\n        if\
          \ pr > 1.5:\n            action = \"MARKDOWN\"\n            if pr > 3.0:\n\
          \                urgency = \"high\"\n                rec = \"Apply 40 pct\
          \ clearance markdown immediately across remaining window\"\n           \
          \     schedule = [0.25, 0.25, 0.40, 0.40, 0.50, 0.50][:weeks_left]\n   \
          \         elif pr >= 2.0:\n                urgency = \"high\" if cover >\
          \ 12 else \"medium\"\n                rec = \"Implement stepped markdown:\
          \ 25 pct for 3 weeks, deepening to 30 pct\"\n                schedule =\
          \ [0.15, 0.15, 0.25, 0.25, 0.30, 0.30][:weeks_left]\n            else:\n\
          \                urgency = \"medium\"\n                rec = \"Introduce\
          \ moderate promotional discount of 15-20 pct\"\n                schedule\
          \ = [0.0, 0.0, 0.15, 0.15, 0.20, 0.20][:weeks_left]\n        elif pr < 0.5\
          \ and trend in (\"rising\", \"stable\"):\n            action = \"REORDER\"\
          \n            urgency = \"high\" if cover < 2 else \"medium\"\n        \
          \    rec = \"Issue purchase order for \" + str(optimal_q) + \" units (Newsvendor\
          \ target service level \" + str(round(cr * 100)) + \" pct)\"\n         \
          \   schedule = None\n        elif vel < 80 and trend == \"declining\" and\
          \ margin < 55:\n            action = \"DROP\"\n            urgency = \"\
          medium\"\n            rec = \"Phase out and delist SKU; redirect shelf space\
          \ to higher-velocity substitutes\"\n            schedule = None\n      \
          \  else:\n            action = \"HOLD\"\n            urgency = \"low\"\n\
          \            rec = \"Maintain current pricing and stock posture; sell-through\
          \ is on track\"\n            schedule = None\n\n        results.append({\n\
          \            \"sku\": sku,\n            \"product_name\": name,\n      \
          \      \"category\": category,\n            \"action\": action,\n      \
          \      \"urgency\": urgency,\n            \"recommendation\": rec,\n   \
          \         \"pressure_ratio\": pr,\n            \"critical_ratio\": cr,\n\
          \            \"optimal_order_quantity\": optimal_q,\n            \"markdown_schedule\"\
          : schedule,\n            \"units_on_hand\": uoh,\n            \"weekly_velocity\"\
          : vel,\n            \"weeks_of_cover\": cover,\n            \"margin_pct\"\
          : margin,\n            \"list_price\": price,\n            \"unit_cost\"\
          : cost,\n            \"trend\": trend\n        })\n\n    return {\"result\"\
          : json.dumps(results)}"
